<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculater</title>
    <link rel="stylesheet" href="style.css">
   
</head>

<body>

    <nav class="heading">
        <a class="btn" href="/" aria-current="page">Home</a>
        <a class="btn" target="_blank" href="https://www.youtube.com/">youtube</a>
    </nav>

    <div class="Calculater">
        <h1>BMI Calculater</h1>
   
    <form>
        <p><label>Height in CM:</label><input type="text" id="height" /></p>
        <p><label>Weight in CM:</label><input type="text" id="weight"/></p> 

        <button>Calculate</button>
        <div id="result"></div>
        <div id="guide"></div>
        <h3>BMI Weight Guide</h3>     
        <p>Under Weight = Less than 18.6</p> 
        <p>Normal Range = 18.6 and 24.9</p>
        <p>overweight = Greater than 24.9</p>

    </div>
    </form>
    <script src="0.1.js"></script>
</body>
 
</html>
